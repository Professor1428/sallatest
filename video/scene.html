  <path d="M-42 450 Q-42 428 -22 428 L22 428 Q42 428 42 450 L48 604 L-48 604 Z" fill="#fff" stroke="#9fb3c2" stroke-width="3"/>
  <line x1="0" y1="440" x2="0" y2="480" stroke="#9fb3c2" stroke-width="2"/>

  <circle cx="0" cy="402" r="27" fill="#d9a877"/>
  <path d="M-34 410 Q-38 366 0 362 Q38 366 34 410 Q30 392 18 384 L-18 384 Q-30 392 -34 410Z" fill="#fff" stroke="#9fb3c2" stroke-width="2.5"/>
  <path d="M-34 410 L-40 440 L-24 432 Z" fill="#fff" stroke="#9fb3c2" stroke-width="2"/><path d="M34 410 L40 440 L24 432 Z" fill="#fff" stroke="#9fb3c2" stroke-width="2"/>
  <ellipse cx="0" cy="372" rx="31" ry="8" fill="none" stroke="#111" stroke-width="5"/>
  <circle cx="-9" cy="402" r="2.8" fill="#222"/><circle cx="9" cy="402" r="2.8" fill="#222"/>

 <!-- screen glow -->

 <!-- camera -->
 <g><rect x="618" y="74" width="44" height="20" rx="4" fill="#222"/><circle cx="640" cy="84" r="6" fill="#09222e" stroke="#555" stroke-width="2"/><circle id="camled" cx="656" cy="79" r="2.5" fill="#444"/></g>
 <!-- screen -->
 <g transform="translate(361,100) scale(0.9) translate(-330,-18)">
<g id="screen">
  <rect x="330" y="18" width="620" height="232" rx="12" fill="#05101a" stroke="#2a3b49" stroke-width="5"/>
  <rect x="632" y="250" width="16" height="30" fill="#2a3b49"/>
  <text id="tx_user" x="640" y="48" text-anchor="middle" font-size="19" fill="#fde68a" class="ar"></text>
  <g id="ringg" transform="translate(450,140)">
   <circle id="ringglow" r="70" fill="#22d3ee" opacity=".15"/>
   <circle r="56" fill="none" stroke="#22d3ee" stroke-width="3"/>
   <circle id="ringdash" r="44" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="7 7"/>
   <circle id="ringcore" r="22" fill="#22d3ee"/>
   <circle r="9" fill="#05101a"/>
  </g>
  <text id="tx_status" x="450" y="232" text-anchor="middle" font-size="15" fill="#7fd8ea" class="ar"></text>
  <line x1="560" y1="66" x2="560" y2="196" stroke="#16384b"/>
  <text id="tx_loghead" x="925" y="80" text-anchor="start" font-size="14" fill="#5fa8bd" class="ar">سجل الأدوات المنفّذة</text>
  <g id="logs"></g>
  <g id="handg" opacity="0"></g>

  <text id="tx_r2" x="925" y="238" text-anchor="start" font-size="17" fill="#fff" class="ar"></text>
 </g>

 
 </g>
</g>

</g>

<g id="intro" opacity="1"><rect width="1280" height="720" fill="url(#introg)"/>
 <circle cx="640" cy="240" r="64" fill="none" stroke="#22d3ee" stroke-width="4"/><circle cx="640" cy="240" r="48" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="7 7"/><circle cx="640" cy="240" r="26" fill="#22d3ee"/><circle cx="640" cy="240" r="11" fill="#07121f"/>
 <text x="640" y="400" text-anchor="middle" font-size="68" font-weight="bold" fill="#22d3ee" class="ar">جارفيس السعودي</text>
 <text x="640" y="462" text-anchor="middle" font-size="28" fill="#cfe8f3" class="ar">هكذا سيبدو المشروع في المعرض</text>
 <text x="640" y="530" text-anchor="middle" font-size="18" fill="#f5b942" class="ar">فيديو توضيحي متحرك (محاكاة) وليس تصويرًا حقيقيًا</text></g>
<g id="outro" opacity="0"><rect width="1280" height="720" fill="url(#introg)"/>
 <circle cx="640" cy="230" r="64" fill="none" stroke="#22d3ee" stroke-width="4"/><circle cx="640" cy="230" r="26" fill="#22d3ee"/><circle cx="640" cy="230" r="11" fill="#07121f"/>
 <text x="640" y="390" text-anchor="middle" font-size="60" font-weight="bold" fill="#22d3ee" class="ar">جارفيس السعودي</text>
 <text x="640" y="450" text-anchor="middle" font-size="28" fill="#fff" class="ar">مساعد يفهمك ويخدمك بلهجتك</text>
 <text x="640" y="520" text-anchor="middle" font-size="20" fill="#9fc3d3" class="ar">Claude · Tool Use · ESP32 · الإيماءات</text></g>
</svg>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ramp=(t,a,b)=>cl((t-a)/(b-a));
const ease=x=>x*x*(3-2*x);
const lerp=(a,b,k)=>a+(b-a)*k;
const mix=(c1,c2,k)=>c1.map((v,i)=>Math.round(lerp(v,c2[i],k)));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
const {speeches,thinks,replies,logs,lights,walk}=TL;
const [g0,g1]=TL.gest,[d0,d1]=TL.diag;

const callouts=[
 {s:5.8,x:170,y:130,w:190,t:"شاشة جارفيس",tx:362,ty:170},
 {s:6.8,x:150,y:262,w:190,t:"باب بقفل ذكي",tx:235,ty:340},
 {s:7.8,x:1130,y:120,w:210,t:"إضاءة تنطفي وتتلوّن",tx:1030,ty:66},
 {s:8.8,x:1150,y:330,w:150,t:"مروحة ذكية",tx:1062,ty:396},
 {s:9.5,x:640,y:34,w:200,t:"كاميرا الإيماءات",tx:640,ty:76}];
const nodes=[
 {x:1090,a:"الزائر",b:"يتكلم بلهجته",c:"#f5b942",o:0},
 {x:860,a:"صوت ← نص",b:"Web Speech",c:"#22d3ee",o:1},
 {x:630,a:"Claude",b:"يفهم ويقرر الأدوات",c:"#22d3ee",o:2},
 {x:400,a:"ESP32",b:"يستقبل الأوامر WiFi",c:"#34d399",o:3},
 {x:170,a:"الأجهزة",b:"💡 إضاءة · مروحة · قفل",c:"#34d399",o:4}];
const NS="http://www.w3.org/2000/svg";
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||$('s')).appendChild(e);return e}
// lamps
const lampXs=[380,900];
const lampEls=lampXs.map(x=>({halo:el('ellipse',{cx:x,cy:30,rx:150,ry:90,fill:'url(#halo)',opacity:0},$('lamps')),body:el('ellipse',{cx:x,cy:26,rx:56,ry:9,fill:'#2a2f36'},$('lamps'))}));
const logEls=[0,1,2,3].map(i=>el('text',{x:575,y:106+i*24,'font-size':16,class:'mono',fill:'#34d399'},$('logs')));
const handLines=[];for(let i=0;i<5;i++){handLines.push([el('line',{stroke:'#34d399','stroke-width':3,'stroke-linecap':'round'},$('handg')),el('circle',{r:5,fill:'#f5b942'},$('handg'))])}
const palm=el('circle',{r:12,fill:'none',stroke:'#34d399','stroke-width':3},$('handg'));
const nodeEls=nodes.map((n,i)=>{const g=el('g',{opacity:0},$('nodes'));
 el('rect',{x:n.x-95,y:270,width:190,height:120,rx:14,fill:'#0d2236',stroke:n.c,'stroke-width':3},g);
 el('text',{x:n.x,y:322,'text-anchor':'middle','font-size':24,'font-weight':'bold',fill:n.c,class:'ar'},g).textContent=n.a;
 el('text',{x:n.x,y:358,'text-anchor':'middle','font-size':14,fill:'#cfe8f3',class:'ar'},g).textContent=n.b;return g});
const calEls=callouts.map(c=>{const g=el('g',{opacity:0},$('callouts'));
 el('line',{x1:c.x,y1:c.y+(c.ty>c.y?18:0),x2:c.tx,y2:c.ty,stroke:'#f5b942','stroke-width':3},g);
 el('circle',{cx:c.tx,cy:c.ty,r:6,fill:'#f5b942'},g);
 el('rect',{x:c.x-c.w/2,y:c.y-18,width:c.w,height:36,rx:18,fill:'#07121f',stroke:'#f5b942','stroke-width':2.5},g);
 el('text',{x:c.x,y:c.y+7,'text-anchor':'middle','font-size':17,fill:'#fff',class:'ar'},g).textContent=c.t;return g});

function typed(text,s,e,t){const k=cl((t-s)/Math.max(0.3,(e-s)*0.8));return text.slice(0,Math.ceil(text.length*k))}
function lightState(t){ // booth lights: smooth transitions between keyframes
 let po=1,pr=0,o=1,r=0;
 for(const ev of lights){const k=ease(ramp(t,ev.t,ev.t+0.6));
  if(t>=ev.t){o=lerp(po,ev.on,k);r=lerp(pr,ev.red,k);po=ev.on;pr=ev.red}else break;}
 return {on:o,red:r};
}
function render(t){
 $('intro').setAttribute('opacity',1-ramp(t,4.4,5.4));
 $('outro').setAttribute('opacity',ramp(t,d1+.6,d1+1.6));
 // visitor
 const VX=620;
 const vx=t<walk[0]?-160:t<walk[1]?lerp(-160,VX,ease(ramp(t,walk[0],walk[1]))):VX;
 const walking=t>=walk[0]&&t<walk[1];
 const bob=walking?Math.abs(Math.sin(t*9))*-6:0;
 const sp=speeches.find(x=>t>=x.s&&t<=x.e);
 $('visitor').setAttribute('transform',`translate(${vx},${bob})`);
 $('mouth').setAttribute('ry',sp?1.5+Math.abs(Math.sin(t*14))*4:1.5);
 $('waves').setAttribute('opacity',sp?(0.5+0.5*Math.sin(t*12)):0);
 const raise=ease(ramp(t,g0-.7,g0+.3))*(1-ease(ramp(t,g1-.5,g1+.3)));
 const ang=lerp(-10,-150+16*Math.sin(t*7),raise);
 $('rarm').setAttribute('transform',`translate(38,455) rotate(${walking?-10+Math.sin(t*9)*8:ang})`);
 // user transcript on screen
 const bs=speeches.find(x=>t>=x.s&&t<=x.e+2.5);
 $('tx_user').textContent=bs?'الزائر: «'+typed(bs.t,bs.s,bs.e,t)+'»':'';
 // jarvis state
 const think=thinks.find(x=>t>=x[0]&&t<x[1]);
 const rep=replies.find(x=>t>=x.s&&t<=x.e);
 const gest=t>=g0&&t<g1;
 let state='idle';
 if(sp)state='listen';else if(think)state='think';else if(rep)state='talk';else if(gest)state='gest';
 const cfg={idle:['جاهز','#22d3ee'],listen:['يستمع…','#fde68a'],think:['يفكر…','#f5b942'],talk:['يتكلم','#34d399'],gest:['تتبّع اليد','#34d399']}[state];
 $('tx_status').textContent=t<16?'جاهز':cfg[0];
 const col=t<16?'#22d3ee':cfg[1];
 const amp=state==='idle'?3:(Math.abs(Math.sin(t*11))*0.6+Math.abs(Math.sin(t*5.3))*0.4)*14;
 $('ringcore').setAttribute('r',22+amp);$('ringcore').setAttribute('fill',col);
 $('ringglow').setAttribute('r',70+amp*1.5);$('ringglow').setAttribute('fill',col);
 const spin=state==='think'?260:state==='gest'?180:40;
 $('ringdash').setAttribute('transform',`rotate(${t*spin})`);$('ringdash').setAttribute('stroke',col);
 $('ringg').setAttribute('transform',`translate(${gest?450+34*Math.sin((t-g0)*3.2):450},140)`);
 // reply
 if(rep&&rep.l.length>1){const m=rep.s+(rep.e-rep.s)*0.5;$('tx_r1').textContent=typed(rep.l[0],rep.s,m,t);$('tx_r2').textContent=typed(rep.l[1],m,rep.e,t)}
 else {$('tx_r1').textContent=rep?typed(rep.l[0],rep.s,rep.e,t):'';$('tx_r2').textContent=''}
 // logs
 const shown=logs.filter(l=>t>=l.t).slice(-4);
 logEls.forEach((e,i)=>{const l=shown[i];e.textContent=l?'▸ '+l.x:'';e.setAttribute('fill',l&&l===shown[shown.length-1]?'#34d399':'#2c7f66')});
 $('tx_loghead').textContent=gest?'كاميرا الإيماءات: تتبّع اليد':'سجل الأدوات المنفّذة';
 $('handg').setAttribute('opacity',gest?1:0);
 if(gest){const cx=800+Math.sin((t-g0)*3.2)*18,cy=170,tilt=Math.sin((t-g0)*3.2)*0.35;
  palm.setAttribute('cx',cx);palm.setAttribute('cy',cy);
  handLines.forEach((h,i)=>{const a=-Math.PI/2+(i-2)*0.42+tilt,len=(i===0||i===4?34:46)*1.2,x2=cx+Math.cos(a)*len,y2=cy-10+Math.sin(a)*len;
   h[0].setAttribute('x1',cx);h[0].setAttribute('y1',cy-10);h[0].setAttribute('x2',x2);h[0].setAttribute('y2',y2);h[1].setAttribute('cx',x2);h[1].setAttribute('cy',y2)})}
 $('camled').setAttribute('fill',gest||sp?'#34d399':'#444');
 // ---- booth lighting ----
 const L=lightState(t);
 const warm=[255,233,176],redc=[255,59,59];
 const lc=mix(warm,redc,L.red);
 $('dark').setAttribute('opacity',(1-L.on)*0.72);
 $('tint').setAttribute('opacity',L.on*L.red*0.22);
 $('led').setAttribute('fill',L.on>0.03?rgb(mix([42,47,54],lc,L.on)):'#2a2f36');
 $('ledglow').setAttribute('fill',rgb(lc));$('ledglow').setAttribute('opacity',L.on*0.38);
 lampEls.forEach(l=>{l.halo.setAttribute('fill',rgb(lc));l.halo.setAttribute('opacity',L.on*0.55);l.body.setAttribute('fill',rgb(mix([42,47,54],lc,L.on)))});
 $('scrglow').setAttribute('opacity',0.06+(1-L.on)*0.30);
 // fan
 $('fan').setAttribute('transform',`rotate(${t>TL.fan?(t-TL.fan)*300:0})`);
 // door
 const o=ease(ramp(t,TL.door[0],TL.door[0]+.9))*(1-ease(ramp(t,TL.door[1],TL.door[1]+.9)));
 const dk=(1-L.on)*0.72;
 $('door').setAttribute('transform',`translate(225,304) scale(${1-0.85*o},1)`);
 $('door').firstChild.setAttribute('fill',rgb(mix([139,94,60],[28,18,12],dk)));
 $('exterior').setAttribute('opacity',o*0.95);
 $('spill').setAttribute('opacity',o*(0.25+dk*0.7));
 $('lockled').setAttribute('fill',o>0.05?'#34d399':'#ff4d4d');
 // callouts
 callouts.forEach((c,i)=>calEls[i].setAttribute('opacity',cl(ramp(t,c.s,c.s+0.4))*(1-ramp(t,10.6,11))));
 // diagram
 $('diag').setAttribute('opacity',cl(ramp(t,d0-.2,d0+.5)*(1-ramp(t,d1-.8,d1))));
