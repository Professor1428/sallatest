 <circle cx="640" cy="240" r="64" fill="none" stroke="#22d3ee" stroke-width="4"/><circle cx="640" cy="240" r="48" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="7 7"/><circle cx="640" cy="240" r="26" fill="#22d3ee"/><circle cx="640" cy="240" r="11" fill="#07121f"/>
 <text x="640" y="400" text-anchor="middle" font-size="68" font-weight="bold" fill="#22d3ee" class="ar">جارفيس السعودي</text>
 <text x="640" y="462" text-anchor="middle" font-size="28" fill="#cfe8f3" class="ar">هكذا سيبدو المشروع في المعرض</text>
 <text x="640" y="530" text-anchor="middle" font-size="18" fill="#f5b942" class="ar">فيديو توضيحي متحرك (محاكاة) وليس تصويرًا حقيقيًا</text></g>
<g id="outro" opacity="0"><rect width="1280" height="720" fill="url(#introg)"/>
 <circle cx="640" cy="230" r="64" fill="none" stroke="#22d3ee" stroke-width="4"/><circle cx="640" cy="230" r="26" fill="#22d3ee"/><circle cx="640" cy="230" r="11" fill="#07121f"/>
 <text x="640" y="390" text-anchor="middle" font-size="60" font-weight="bold" fill="#22d3ee" class="ar">جارفيس السعودي</text>
 <text x="640" y="450" text-anchor="middle" font-size="28" fill="#fff" class="ar">مساعد يفهمك ويخدمك بلهجتك</text>
 <text x="640" y="520" text-anchor="middle" font-size="20" fill="#9fc3d3" class="ar">Claude · Tool Use · ESP32 · الإيماءات</text></g>
</svg>

<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ramp=(t,a,b)=>cl((t-a)/(b-a));
const ease=x=>x*x*(3-2*x);
const lerp=(a,b,k)=>a+(b-a)*k;
const mix=(c1,c2,k)=>c1.map((v,i)=>Math.round(lerp(v,c2[i],k)));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;

const speeches=[
 {s:16.5,e:19,t:"يا جارفيس، عرّف نفسك للضيوف"},
 {s:23.5,e:25.5,t:"شغّل الأنوار"},
 {s:29,e:31,t:"خلها حمراء"},
 {s:35,e:37,t:"أنا بنام"},
 {s:48,e:50,t:"افتح الباب"}];
const thinks=[[19,20],[25.5,26.5],[31,32],[37,38.5],[50,51]];
const replies=[
 {s:20,e:23.5,l:["هلا والله! أنا جارفيس، مساعدك الذكي.","أفهم لهجتك وأتحكم في البيت."]},
 {s:26.5,e:29,l:["أبشر، شغلت الأنوار."]},
 {s:32,e:34.5,l:["تم، الإضاءة صارت حمراء."]},
 {s:42,e:47.5,l:["تصبح على خير! أطفأت الأنوار وشغلت المروحة،","والمنبه على ٤:٤٥ لصلاة الفجر."]},
 {s:51,e:54,l:["تفضل، الباب مفتوح."]}];
const logs=[
 {t:26.6,x:'control_light("majlis","on")'},{t:32.1,x:'control_light(color="red")'},
 {t:38.6,x:'get_prayer_times()'},{t:39.6,x:'control_light("off")'},{t:40.6,x:'control_fan("on")'},{t:41.6,x:'set_alarm("04:45")'},
 {t:51.1,x:'unlock_door()'}];
const caps=[
 {s:5,e:11,t:"هذا جناحك في المعرض: شاشة كبيرة، ومجسم بيت ذكي على الطاولة، وكاميرا للإيماءات"},
 {s:11,e:16.3,t:"يقترب الزائر من الجناح ليجرّب بنفسه"},
 {s:16.5,e:23.5,t:"يكلّم جارفيس بلهجته، وجارفيس يرد عليه بصوت عربي"},
 {s:23.5,e:34.5,t:"الأجهزة تستجيب أمام عينه مباشرة: إضاءة وتغيير لون"},
 {s:35,e:47.8,t:"بأمر واحد «أنا بنام» يقرر جارفيس الخطوات بنفسه: أنوار، مروحة، منبه"},
 {s:48,e:55,t:"وحتى قفل الباب يُفتح بصوتك عبر محرك سيرفو"},
 {s:55,e:63,t:"وبحركة اليد: يلوّح الزائر فتتفاعل الواجهة معه"},
 {s:63,e:72,t:"الصوت يتحول لنص، Claude يقرر الأدوات، وESP32 ينفّذ على الأجهزة"}];
const callouts=[
 {s:6,x:150,y:60,w:190,t:"شاشة جارفيس",tx:330,ty:100},
 {s:7.2,x:240,y:300,w:200,t:"مجسم البيت الذكي",tx:460,ty:380},
 {s:8.4,x:1010,y:280,w:190,t:"كاميرا الإيماءات",tx:1010,ty:318},
 {s:9.6,x:960,y:40,w:200,t:"بانر + QR للتجربة",tx:1100,ty:110}];
const nodes=[
 {x:1090,a:"الزائر",b:"يتكلم بلهجته",c:"#f5b942",tt:63.3},
 {x:860,a:"صوت ← نص",b:"Web Speech",c:"#22d3ee",tt:64.6},
 {x:630,a:"Claude",b:"يفهم ويقرر الأدوات",c:"#22d3ee",tt:65.9},
 {x:400,a:"ESP32",b:"يستقبل الأوامر WiFi",c:"#34d399",tt:67.2},
 {x:170,a:"الأجهزة",b:"💡 إضاءة · مروحة · قفل",c:"#34d399",tt:68.5}];

// build static dynamic parts
const NS="http://www.w3.org/2000/svg";
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||$('s')).appendChild(e);return e}
const logEls=[0,1,2,3].map(i=>{const e=el('text',{x:575,y:106+i*24,'font-size':14,class:'mono',fill:'#34d399'},$('logs'));return e});
const handLines=[];
for(let i=0;i<5;i++){handLines.push([el('line',{stroke:'#34d399','stroke-width':3,'stroke-linecap':'round'},$('handg')),el('circle',{r:5,fill:'#f5b942'},$('handg'))])}
const palm=el('circle',{r:12,fill:'none',stroke:'#34d399','stroke-width':3},$('handg'));
const nodeEls=nodes.map(n=>{const g=el('g',{opacity:0},$('nodes'));
 el('rect',{x:n.x-95,y:270,width:190,height:120,rx:14,fill:'#0d2236',stroke:n.c,'stroke-width':3},g);
 const a=el('text',{x:n.x,y:322,'text-anchor':'middle','font-size':24,'font-weight':'bold',fill:n.c,class:'ar'},g);a.textContent=n.a;
 const b=el('text',{x:n.x,y:358,'text-anchor':'middle','font-size':14,fill:'#cfe8f3',class:'ar'},g);b.textContent=n.b;return g});
const calEls=callouts.map(c=>{const g=el('g',{opacity:0},$('callouts'));
 el('line',{x1:c.x,y1:c.y+(c.ty>c.y?18:0),x2:c.tx,y2:c.ty,stroke:'#f5b942','stroke-width':3},g);
 el('circle',{cx:c.tx,cy:c.ty,r:6,fill:'#f5b942'},g);
 el('rect',{x:c.x-c.w/2,y:c.y-18,width:c.w,height:36,rx:18,fill:'#07121f',stroke:'#f5b942','stroke-width':2.5},g);
 const t=el('text',{x:c.x,y:c.y+7,'text-anchor':'middle','font-size':17,fill:'#fff',class:'ar'},g);t.textContent=c.t;return g});

function typed(text,s,e,t){const k=cl((t-s)/Math.max(0.3,(e-s)*0.75));return text.slice(0,Math.ceil(text.length*k))}

function render(t){
 // intro / outro
 $('intro').setAttribute('opacity',1-ramp(t,4.4,5.4));
 $('outro').setAttribute('opacity',ramp(t,72,73));
 // visitor
 let vx=t<11?-160:t<16.3?lerp(-160,250,ease(ramp(t,11,16.3))):250;
 const walking=t>=11&&t<16.3;
 const bob=walking?Math.abs(Math.sin(t*9))*-6:0;
 const sp=speeches.find(x=>t>=x.s&&t<=x.e);
 const speaking=!!sp;
 $('visitor').setAttribute('transform',`translate(${vx},${bob})`);
 $('mouth').setAttribute('ry',speaking?1.5+Math.abs(Math.sin(t*14))*4:1.5);
 const raise=ease(ramp(t,54.3,55.3))*(1-ease(ramp(t,62.5,63.3)));
 const ang=lerp(-10,-150+16*Math.sin(t*7),raise);
 $('rarm').setAttribute('transform',`translate(38,455) rotate(${walking?-10+Math.sin(t*9)*8:ang})`);
 // bubble
 const bs=speeches.find(x=>t>=x.s&&t<=x.e+0.7);
 $('bubble').setAttribute('opacity',bs?1:0);
 $('bubble').setAttribute('transform',`translate(${vx-190},0)`);
 $('btail').setAttribute('points','170,324 200,324 190,352');
 $('tx_bub').textContent=bs?typed(bs.t,bs.s,bs.e,t):'';
 $('tx_user').textContent=bs&&t<bs.e+3?'«'+typed(bs.t,bs.s,bs.e,t)+'»':'';
 // jarvis state
 const think=thinks.find(x=>t>=x[0]&&t<x[1]);
 const rep=replies.find(x=>t>=x.s&&t<=x.e);
 const gest=t>=55&&t<63;
 let state='idle';
 if(speaking)state='listen';else if(think)state='think';else if(rep)state='talk';else if(gest)state='gest';else if(t>=38.5&&t<42)state='exec';
 const cfg={idle:['ينتظر…','#22d3ee'],listen:['يستمع…','#fde68a'],think:['يفكر…','#f5b942'],talk:['يتكلم','#34d399'],gest:['تتبّع اليد','#34d399'],exec:['ينفّذ الأوامر…','#34d399']}[state];
 $('tx_status').textContent=t<16?'جاهز':cfg[0];
 const col=t<16?'#22d3ee':cfg[1];
 const amp=state==='idle'?3:(Math.abs(Math.sin(t*11))*0.6+Math.abs(Math.sin(t*5.3))*0.4)*14;
 $('ringcore').setAttribute('r',22+amp);$('ringcore').setAttribute('fill',col);
 $('ringglow').setAttribute('r',70+amp*1.5);$('ringglow').setAttribute('fill',col);
 const spin=(state==='think'||state==='exec')?260:state==='gest'?180:40;
 $('ringdash').setAttribute('transform',`rotate(${t*spin})`);$('ringdash').setAttribute('stroke',col);
 const rx=gest?450+34*Math.sin((t-55)*3.2):450;
 $('ringg').setAttribute('transform',`translate(${rx},140)`);
 // reply text
 const l1=rep?rep.l[0]:'',l2=rep&&rep.l[1]?rep.l[1]:'';
 $('tx_r1').textContent=rep?typed(l1,rep.s,rep.s+(rep.e-rep.s)*(l2?0.5:1),t):'';
 $('tx_r2').textContent=rep&&l2?typed(l2,rep.s+(rep.e-rep.s)*0.5,rep.e,t):'';
 // logs
 const shown=logs.filter(l=>t>=l.t).slice(-4);
 logEls.forEach((e,i)=>{const l=shown[i];e.textContent=l?'▸ '+l.x:'';e.setAttribute('fill',l&&l===shown[shown.length-1]?'#34d399':'#2c7f66')});
 $('tx_loghead').textContent=gest?'كاميرا الإيماءات: تتبّع اليد':'سجل الأدوات المنفّذة';
 // hand skeleton
 $('handg').setAttribute('opacity',gest?1:0);
 if(gest){const cx=800+Math.sin((t-55)*3.2)*18,cy=170;const tilt=Math.sin((t-55)*3.2)*0.35;
  palm.setAttribute('cx',cx);palm.setAttribute('cy',cy);
  handLines.forEach((h,i)=>{const a=-Math.PI/2+(i-2)*0.42+tilt;const len=i===0||i===4?34:46;const x1=cx,y1=cy-10;const x2=cx+Math.cos(a)*len*1.2,y2=cy-10+Math.sin(a)*len*1.2;
   h[0].setAttribute('x1',x1);h[0].setAttribute('y1',y1);h[0].setAttribute('x2',x2);h[0].setAttribute('y2',y2);h[1].setAttribute('cx',x2);h[1].setAttribute('cy',y2)})}
 $('camled').setAttribute('fill',gest||speaking?'#34d399':'#444');
 // light
 const on=cl(ramp(t,26.5,27.2)-ramp(t,39.8,40.5));
 const lc=mix([255,211,107],[255,59,59],ramp(t,32,33));
 $('majlis').setAttribute('fill',on>0.02?rgb(mix([29,43,54],lc,on)):'#1d2b36');
 $('bulb').setAttribute('fill',on>0.02?rgb(mix([68,68,68],lc,on)):'#444');
 $('glowl').setAttribute('fill',rgb(lc));$('glowl').setAttribute('opacity',on*0.28);
 $('lbl_m').setAttribute('fill',on>0.5?'#07121f':'#9fb3c2');
 // fan
 const fa=t>40.8?(t-40.8)*300:0;$('fan').setAttribute('transform',`rotate(${fa})`);
 // door
 const o=ease(ramp(t,51,51.8))*(1-ease(ramp(t,58,58.8)));
 $('door').setAttribute('transform',`translate(745,390) scale(${1-0.82*o},1)`);
 // callouts
 callouts.forEach((c,i)=>calEls[i].setAttribute('opacity',cl(ramp(t,c.s,c.s+0.4))*(1-ramp(t,10.6,11))));
 // diagram
 $('diag').setAttribute('opacity',cl(ramp(t,62.8,63.5)*(1-ramp(t,71.2,72))));
 nodes.forEach((n,i)=>nodeEls[i].setAttribute('opacity',ramp(t,n.tt,n.tt+0.4)));
 const px=lerp(1090,170,ease(ramp(t,63.3,70.5)));$('pulse').setAttribute('cx',px);$('pulse').setAttribute('r',9+Math.sin(t*10)*2);
 // captions
 const c=caps.find(x=>t>=x.s&&t<x.e);
 $('cap').textContent=c?c.t:'';
 $('capg').setAttribute('opacity',c?cl(Math.min(ramp(t,c.s,c.s+0.3),1-ramp(t,c.e-0.3,c.e))):0);
}
window.render=render;render(0);
</script></body></html>
